commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "50669e41b7c12e6371b6158c654330e41fd3c4fa"], # v0.56.2
]

[hypr-shiny-border]
description = "Gradient window border that faces the cursor"
authors = ["wmfeht"]
output = "hypr-shiny-border.so"
build = [
    "make all",
]
